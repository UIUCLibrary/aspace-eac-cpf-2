name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.1 is the language level of the JRuby that ArchivesSpace 4.x ships
        ruby: ['3.1', '3.4']
    env:
      BUNDLE_GEMFILE: spec/Gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
